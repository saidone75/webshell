spring:
  application:
    name: webshell
  output:
    ansi:
      enabled: always
application:
  shell:
    password: ${SHELL_PASSWORD:0704SmcGUznwetKvPgYB}
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_WINDOW_SECONDS:60}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: strict

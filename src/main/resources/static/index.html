<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Web Shell</title>
    <link rel="stylesheet" href="webjars/xterm/5.3.0/css/xterm.css"/>
    <style>
        #terminal {
            width: 100%;
            height: 90vh;
            background-color: #000;
        }

        #password-form {
            margin: 1rem 0;
        }

        #password-form input {
            padding: 0.4rem;
        }
    </style>
</head>
<body>
<h2>Web Shell</h2>
<form id="password-form">
    <label for="shell-password">Password:</label>
    <input id="shell-password" name="password" type="password" required autofocus>
    <button type="submit">Connetti</button>
</form>
<div id="terminal"></div>

<script src="webjars/xterm/5.3.0/lib/xterm.js"></script>
<script src="webjars/xterm-addon-fit/0.8.0/lib/xterm-addon-fit.js"></script>
<script>
    const term = new Terminal({
        cursorBlink: true
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    function sendTerminalSize(socket) {
        if (socket.readyState === WebSocket.OPEN) {
            socket.send(`resize:${term.cols}:${term.rows}`);
        }
    }

    function getContextPath() {
        const pageName = '/index.html';
        const path = window.location.pathname;
        return path.endsWith(pageName) ? path.slice(0, -pageName.length) : path.replace(/\/$/, '');
    }

    document.getElementById('password-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const password = document.getElementById('shell-password').value;
        form.remove();

        // WebSocket connection
        const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const socket = new WebSocket(
            protocol + location.host + getContextPath() + '/shell?password=' + encodeURIComponent(password));

        socket.addEventListener('open', () => sendTerminalSize(socket));

        // Server output to the xterm console
        socket.onmessage = (event) => {
            term.write(event.data);
        };

        socket.onclose = () => {
            term.write('\r\n\x1b[31m[Connection closed by the server]\x1b[0m\r\n');
        };

        // Send user input to the server via WebSocket
        term.onData((data) => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(data);
            }
        });

        window.addEventListener('resize', () => {
            fitAddon.fit();
            sendTerminalSize(socket);
        });

        setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
                // keepalive
                socket.send('');
            }
        }, 15000);
    });
</script>
</body>
</html>

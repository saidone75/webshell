<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Shell</title>
    <link rel="stylesheet" href="/webjars/xterm/5.3.0/css/xterm.css"/>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #080b12;
            color: #e8edf7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(1rem, 3vw, 2.5rem);
            background: radial-gradient(circle at top right, #17233d 0, #080b12 42rem);
        }

        .shell-app {
            width: min(1120px, 100%);
            min-height: calc(100vh - clamp(2rem, 6vw, 5rem));
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            letter-spacing: -0.04em;
        }

        .card {
            border: 1px solid #263247;
            border-radius: 16px;
            background: rgba(15, 21, 34, 0.88);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
        }

        #terminal {
            min-height: 420px;
            height: min(68vh, 720px);
            padding: 1rem;
            overflow: hidden;
            border-radius: 16px;
            background: #05070b;
        }

        #terminal .xterm-viewport {
            border-radius: 8px;
        }

        #password-form {
            display: flex;
            align-items: end;
            gap: 0.75rem;
            padding: 1rem;
        }

        .field {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            color: #aab8cb;
            font-size: 0.82rem;
            font-weight: 600;
        }

        #password-form input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid #34445e;
            border-radius: 9px;
            outline: none;
            background: #0a0f19;
            color: #f1f5f9;
            font: inherit;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        #password-form input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
        }

        button {
            padding: 0.7rem 1.05rem;
            border: 0;
            border-radius: 9px;
            background: #38bdf8;
            color: #06111b;
            cursor: pointer;
            font: inherit;
            font-weight: 750;
            transition: background 160ms ease, transform 160ms ease;
        }

        button:hover {
            background: #7dd3fc;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 560px) {
            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            #password-form {
                align-items: stretch;
                flex-direction: column;
            }

            #terminal {
                min-height: 360px;
                height: 58vh;
                padding: 0.65rem;
            }
        }
    </style>
</head>
<body>
<main class="shell-app">
    <header class="header">
        <div>
            <h1>Web Shell</h1>
        </div>
    </header>

    <form id="password-form" class="card">
        <div class="field">
            <label for="shell-password">Password</label>
            <input id="shell-password" name="password" type="password" placeholder="Inserisci la password" required autofocus>
        </div>
        <button type="submit">Connetti</button>
    </form>
    <div id="terminal" class="card" aria-label="Terminale"></div>
</main>

<script src="/webjars/xterm/5.3.0/lib/xterm.js"></script>
<script src="/webjars/xterm-addon-fit/0.8.0/lib/xterm-addon-fit.js"></script>
<script>
    const term = new Terminal({
        cursorBlink: true
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    function sendTerminalSize(socket) {
        if (socket.readyState === WebSocket.OPEN) {
            socket.send(`resize:${term.cols}:${term.rows}`);
        }
    }

    document.getElementById('password-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const password = document.getElementById('shell-password').value;
        form.remove();

        // WebSocket connection
        const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const socket = new WebSocket(
            protocol + location.host + '/shell?password=' + encodeURIComponent(password));

        socket.addEventListener('open', () => sendTerminalSize(socket));

        // Server output to the xterm console
        socket.onmessage = (event) => {
            term.write(event.data);
        };

        socket.onclose = () => {
            term.write('\r\n\x1b[31m[Connection closed by the server]\x1b[0m\r\n');
        };

        // Send user input to the server via WebSocket
        term.onData((data) => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(data);
            }
        });

        window.addEventListener('resize', () => {
            fitAddon.fit();
            sendTerminalSize(socket);
        });

        setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
                // keepalive
                socket.send('');
            }
        }, 15000);
    });
</script>
</body>
</html>
